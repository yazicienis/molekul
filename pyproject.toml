[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molekul"
version = "0.2.0.dev0"
description = "Experimental ab initio molecular simulation platform for hardware benchmarking"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
gpu = ["cupy-cuda12x", "numba"]
# Everything needed to run the teaching notebooks in notebooks/.
# pyscf powers only the optional "compare against a reference code" cells;
# py3Dmol powers only the optional inline 3D orbital/molecule viewer.
notebooks = [
    "jupyter",
    "matplotlib>=3.6",
    "pyscf>=2.3",
    "py3Dmol>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
